# Server Block de Nginx para HidroCalc
# Archivo: /etc/nginx/sites-available/hidrocalc
# La aplicación queda disponible en http://localhost:8080/hidrocalc/

server {
    listen 8080;                     # puerto de pruebas
    listen [::]:8080;
    server_name localhost;

    access_log /var/log/nginx/hidrocalc_access.log;
    error_log  /var/log/nginx/hidrocalc_error.log;

    # Ruta simulada /hidrocalc  ->  carpeta /var/www/hidrocalc
    location = /hidrocalc {
        return 301 /hidrocalc/;
    }

    location /hidrocalc/ {
        alias /var/www/hidrocalc/;
        index index.html;
        try_files $uri $uri/ /hidrocalc/index.html;
    }

    # Caché para archivos estáticos (CSS, JS e imágenes)
    location ~* ^/hidrocalc/(.+\.(css|js|jpg|webp|svg))$ {
        alias /var/www/hidrocalc/$1;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Compresión gzip para texto
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
