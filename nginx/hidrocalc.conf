# Server Blocks de Nginx para HidroCalc v2
# Archivo: /etc/nginx/sites-available/hidrocalc
# Dominio local: hidrocalc.local (agregado en /etc/hosts)
#   http://hidrocalc.local:8080  ->  redirige a  https://hidrocalc.local:8443

server_tokens off;    # no mostrar la versión de Nginx

# 1) HTTP: solo redirige a HTTPS
server {
    listen 8080;
    listen [::]:8080;
    server_name hidrocalc.local;

    return 301 https://$host:8443$request_uri;
}

# 2) HTTPS con certificado local
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name hidrocalc.local;

    ssl_certificate     /etc/nginx/ssl/hidrocalc.local.crt;
    ssl_certificate_key /etc/nginx/ssl/hidrocalc.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/hidrocalc_access.log;
    error_log  /var/log/nginx/hidrocalc_error.log;

    # Encabezados de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Toda la aplicación (páginas y API) la atiende Express en el puerto 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
