# Definición del proyecto de Xcode (se genera con: xcodegen generate)
name: HidroCalc
options:
  bundleIdPrefix: io.github.wxnderingmoon
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  HidroCalc:
    type: application
    platform: iOS
    sources:
      - path: HidroCalc/Sources
      - path: HidroCalc/Resources/www
        type: folder
        buildPhase: resources
      - path: HidroCalc/Assets.xcassets
      - path: HidroCalc/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wxnderingmoon.hidrocalc
        PRODUCT_NAME: HidroCalc
        INFOPLIST_FILE: HidroCalc/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme: {}
